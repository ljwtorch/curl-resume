name = "terminal-resume"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 开发环境配置
[dev]
port = 8789
ip = "0.0.0.0" # 监听所有网卡，局域网内设备可通过本机 IP:8789 访问
local_protocol = "http"

# 生产环境变量 (可选)
[vars]
ENVIRONMENT = "production"

# 自定义域名路由 (部署后在 Cloudflare Dashboard 配置)
routes = [{ pattern = "me.pdjjq.org/*", zone_name = "pdjjq.org" }]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
